name: Build FM-9 VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Rust (emulateur de la puce de la FM-1)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: FM-9-VST3-Windows
          path: build/FM9_artefacts/Release/VST3/
          if-no-files-found: error

  macos:
    permissions:
      contents: write
    runs-on: macos-13         # Intel (files macos-15 / arm64 saturees chez GitHub) ; binaire universel quand meme
    steps:
      - uses: actions/checkout@v5
      - name: Rust (emulateur de la puce de la FM-1, universel)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version
      - name: Configure (binaire universel Intel + Apple Silicon)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Signature locale (ad hoc) et archive
        run: |
          cd "build/FM9_artefacts/Release/VST3"
          xattr -cr "FM-9.vst3"
          codesign --force --deep --sign - "FM-9.vst3"
          codesign --verify --deep --strict "FM-9.vst3"
          ditto -c -k --sequesterRsrc --keepParent "FM-9.vst3" "$GITHUB_WORKSPACE/FM-9-VST3-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FM-9-VST3-macOS
          path: FM-9-VST3-macOS.zip
          if-no-files-found: error
      - name: Ajout a la version publiee
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/^project([A-Za-z0-9_]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          for i in $(seq 1 40); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 30; done     # la version Windows est publiee d'abord
          gh release upload "$TAG" FM-9-VST3-macOS.zip --clobber

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les liens .../releases/latest/download/FM-9-VST3-<OS>.zip du README suivent chaque version.
  release:
    # la version Windows sort sans attendre le Mac (files macOS de GitHub parfois saturees) ;
    # le job macOS ajoute son archive a la meme version des qu'il a tourne
    if: github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project([A-Za-z0-9_]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archives
        run: |
          (cd dist/FM-9-VST3-Windows && zip -r -q "$GITHUB_WORKSPACE/FM-9-VST3-Windows.zip" FM-9.vst3)
      - name: Notice
        run: |
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" FM-9-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="FM-9-VST3-Windows.zip"
          [ -f FM-9-Notice.pdf ] && FILES="$FILES FM-9-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest \
              --title "FM-9 $TAG" \
              --notes "Windows : copier FM-9.vst3 dans C:\\Program Files\\Common Files\\VST3\\. macOS : copier FM-9.vst3 dans ~/Library/Audio/Plug-Ins/VST3/."
          fi
