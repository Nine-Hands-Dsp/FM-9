name: Survey incompatible firmwares

on:
  push:
    branches: [ 'survey/**' ]
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Survey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/survey_incompatible.py assets/plugin/firmwares.json survey_out
      - uses: actions/upload-artifact@v4
        with:
          name: survey
          path: survey_out
